
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Gemini AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>✨ Ask Gemini AI</h1>
        <p>Ask any question and get an AI-powered answer.</p>

        <form id="questionForm">
            <textarea id="question" placeholder="Type your question here..." required></textarea>
            <button type="submit" id="askButton">Ask Gemini</button>
        </form>

        <div id="result">
            <h2>AI Answer</h2>
            <p id="answer">Your answer will appear here.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
